server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore_files?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: [PASSWORD]
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  servlet:        
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

gcp:
  storage:
    bucket-name: bucket-sample-media
    project-id: project-sample-id
    credentials-path: C:\Users\Lenovo\Documents\Fourth Semester\ECA Model\bookstore-eca-project\bookstore\credential.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
